<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>닉스 파츠 추출 진행</title>
<style>body{margin:0;background:#161b25;color:#eee;font:15px system-ui}section{padding:14px 20px;border:1px solid #48536a;border-radius:10px}h2{font-size:18px;margin:0 0 8px}p{margin:6px 0}progress{width:100%;height:14px;accent-color:#d5b978}.muted{color:#b7c1d1;font-size:13px}#error{color:#ffb3aa;white-space:pre-wrap;overflow-wrap:anywhere}button{float:right;padding:6px 12px;cursor:pointer}a{color:#dfc896}</style>
<section><button id="refresh">새로고침</button><h2>닉스 · 로컬 AI 파츠 추출</h2><p id="state" role="status">상태 확인 중…</p><progress id="bar" max="100" aria-label="현재 단계 진행률"></progress><p id="detail" class="muted"></p><p id="error"></p><p class="muted">몸 파츠 → 얼굴 파츠 → 깊이 계산 → PSD 저장 · 표시 비율은 현재 단계 기준</p><p id="stamp" class="muted"></p><p><a href="/parts-progress#identityReview" target="_blank" rel="noopener">보정 결과 비교 · 파츠 PNG/PSD 받기 →</a></p></section>
<script>
class ProgressView {
 render(s) {
  const stale=s.state==='running' && Date.now()/1000-s.updatedAt>20;
  const names={running:'진행 중',failed:'오류로 종료',stopped:'중단됨',completed:'추출 완료 · 미술 검수 필요'};
  document.querySelector('#state').textContent=`${stale?'상태 갱신 끊김 · 실행 여부 확인 필요':names[s.state]} — ${s.stage}`;
  const bar=document.querySelector('#bar');
  if(s.percent!==null && s.state==='running' && !stale) bar.value=s.percent; else bar.removeAttribute('value');
  bar.hidden=s.state!=='running'||stale;
  document.querySelector('#detail').textContent=`${s.step===null?'진행 수치 없음':`${s.step}/${s.total}단계${s.percent===null?(s.state==='running'?' · 결과 복원/저장 중':' · 마지막 생성 기록'):` (${s.percent}%)`}`} · 저장된 PNG ${s.parts}개 · 추출 ${s.resolution}px · 최종 영상 ${s.delivery}`;
  document.querySelector('#error').textContent=s.error||'';
  document.querySelector('#stamp').textContent=`마지막 상태 확인 ${new Date(s.updatedAt*1000).toLocaleString('ko-KR')} · 화면이 열려 있을 때 3초마다 확인`;
 }
 error(){document.querySelector('#state').textContent='진행 상태를 읽을 수 없습니다. 연결을 확인하고 새로고침하세요.';document.querySelector('#bar').hidden=true;}
}
class ProgressController {
 constructor(view){this.view=view;this.timer=null;this.request=null;this.events=new AbortController();this.active=true;
  document.querySelector('#refresh').addEventListener('click',()=>this.refresh(),{signal:this.events.signal});
  document.addEventListener('visibilitychange',()=>{clearTimeout(this.timer);if(document.hidden)this.request?.abort();else this.refresh();},{signal:this.events.signal});
  window.addEventListener('pagehide',()=>this.close(),{signal:this.events.signal});this.refresh();}
 async refresh(){clearTimeout(this.timer);this.request?.abort();if(!this.active||document.hidden)return;
  const request=new AbortController();this.request=request;
  try{const r=await fetch('/assets/nyx-parts-progress.json',{cache:'no-store',signal:request.signal});if(!r.ok)throw Error();const s=await r.json();
   if(!['running','failed','stopped','completed'].includes(s.state)||!Number.isFinite(s.updatedAt))throw Error();
   if(this.active&&this.request===request)this.view.render(s);
  }catch(e){if(e.name!=='AbortError'&&this.active&&this.request===request)this.view.error();}
  finally{if(this.active&&this.request===request&&!document.hidden)this.timer=setTimeout(()=>this.refresh(),3000);}}
 close(){this.active=false;clearTimeout(this.timer);this.request?.abort();this.events.abort();}
}
new ProgressController(new ProgressView());
</script>
<section id="identityReview" style="margin-top:14px" hidden>
<h2>원본 복원 파츠 v02</h2><p><a href="/animation?id=00a3868e750e497f8500a0e85c19396a" target="_blank" rel="noopener">보정 파츠 팔 뻗기 리깅 보기 · 1920 × 1080</a></p>
<p><a href="/parts-progress#identityReview" target="_blank" rel="noopener">보정 파츠 크게 보기</a> · <a id="partsDownload" download="nyx-identity-v02.zip">PNG·PSD 묶음 받기</a></p>
<p id="partsNote" class="muted"></p>
<img id="partsComparison" alt="원본·첫 추출·보정본 얼굴 및 촉매 비교" style="width:100%;max-width:1200px">
<details><summary>18개 파츠 개별 표시·숨김 검사</summary>
<p class="muted">체크를 끄면 해당 파츠를 숨깁니다. 현재 자세의 구성 검사이며 완성 애니메이션이 아닙니다.</p>
<div style="display:flex;flex-wrap:wrap;gap:16px"><canvas id="partsCanvas" width="1024" height="1024" style="width:min(100%,600px);height:auto;background:#a7afb9" aria-label="개별 파츠 조합"></canvas><div id="partsChecks"></div></div>
</details></section>
<script>
class PartsReviewController {
 constructor(){this.abort=new AbortController();this.images=[];this.closed=false;window.addEventListener('pagehide',()=>{this.closed=true;this.abort.abort();this.images.length=0;},{once:true});this.load();}
 async load(){try{
  const r=await fetch('/assets/nyx-identity-review.json',{cache:'no-store',signal:this.abort.signal});if(!r.ok)return;
  const data=await r.json();if(this.closed)return;
  const safe=url=>typeof url==='string'&&/^\/assets\/[a-f0-9]+\.(png|zip)$/.test(url);
  if(!Array.isArray(data.parts)||data.parts.length>100||!safe(data.assets.comparison)||!safe(data.assets.download))throw Error('잘못된 파츠 목록');
  document.querySelector('#partsNote').textContent=data.note;
  document.querySelector('#partsComparison').src=data.assets.comparison;
  document.querySelector('#partsDownload').href=data.assets.download;
  for(const part of data.parts){if(!safe(part.url))throw Error('잘못된 파츠 경로');
   const img=new Image();img.src=part.url;await img.decode();if(this.closed)return;
   const row={img,visible:true};this.images.push(row);
   const label=document.createElement('label');label.style.display='block';const check=document.createElement('input');check.type='checkbox';check.checked=true;
   check.addEventListener('change',()=>{row.visible=check.checked;this.draw();},{signal:this.abort.signal});label.append(check,document.createTextNode(' '+part.name));document.querySelector('#partsChecks').append(label);
  }
  this.draw();document.querySelector('#identityReview').hidden=false;
 }catch(e){if(e.name!=='AbortError'){document.querySelector('#identityReview').hidden=false;document.querySelector('#partsNote').textContent='파츠 미리보기를 불러오지 못했습니다. 새로고침하세요.';}}}
 draw(){if(this.closed)return;const c=document.querySelector('#partsCanvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);for(const row of this.images)if(row.visible)ctx.drawImage(row.img,0,0);}
}
new PartsReviewController();
</script></html>
